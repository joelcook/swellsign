[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swellsign"
version = "0.1.0"
description = "An observation-first ocean instrument for a 128x32 LED sign"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Swell Sign" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "Pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
swellsign = "swellsign.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/swellsign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
