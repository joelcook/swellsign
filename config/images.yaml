# Spot imagery manifest.
#
# Public domain or CC0 only. Neither requires attribution and neither carries a
# share-alike clause, so compositing the sign over one creates no obligation
# that propagates to the app. Credit is composited into the frame anyway,
# because it costs nothing and is the right thing to do.
#
# CC BY-SA is deliberately excluded. Share-alike would attach to every rendered
# frame and follow the app wherever it goes. "New Smyrna Beach Inlet FL 2016"
# was the correct location and was dropped for exactly this reason.
#
# Files are cached to data/images/ which is gitignored; this manifest is the
# tracked source of truth for what to fetch and how it must be credited.

defaults:
  # Used by any spot with no image of its own. The sign falls back to a dark
  # field rather than a wrong photo when this is unset.
  image: new-smyrna

images:
  new-smyrna:
    url: https://www.pexels.com/photo/silhouettes-of-surfers-in-sea-16571068/
    source: Pexels
    license: Pexels License (free, commercial use, attribution not required)
    credit: PEXELS . FREE TO USE
    local_path: data/images/new-smyrna.jpg
    note: >-
      Portrait original, 2592x3888. Cover-cropping to 16:9 keeps the middle
      band, which happens to frame the lineup well and leaves dark water where
      the sign sits.

# Per-spot assignment. Unlisted spots use defaults.image.
spots:
  new-smyrna: new-smyrna
