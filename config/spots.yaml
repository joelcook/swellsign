# A single global threshold cannot be honest across stations. NDBC stamps an
# observation with its measurement time and publishes it later, so with hourly
# reporting the newest available observation sweeps across a full hour of age.
# At 90 minutes the sign said DELAYED every hour while the buoy was working
# perfectly, which teaches you to ignore the one word meant to signal trouble.
#
# Thresholds are therefore derived from each station's expected_interval_minutes
# below, so DELAYED means a report was actually missed. Hourly 41070 resolves to
# 150/240/420; the half-hourly 41113 fallback correctly gets a tighter
# 75/120/210. The values here remain the fallback for stations that declare no
# interval, and a station listed under `stations` overrides everything.
freshness:
  fresh_max_age_minutes: 90
  delayed_max_age_minutes: 180
  stale_max_age_minutes: 360

  derive_from_reporting_interval: true
  fresh_interval_multiplier: 2.5
  delayed_interval_multiplier: 4.0
  stale_interval_multiplier: 7.0

  # Explicit per-station overrides win over derivation. Any field left out is
  # still derived, so you can pin just one edge of the ladder.
  stations: {}

# The sign's wave label. This overrides the basis-derived label (SEAS for total
# sea state, SWELL for a genuine partition, PART for a local one) on the
# physical face only. `/now`, storage, and provenance keep reporting the real
# measurement_basis, so nothing here causes a total sea state to be recorded as
# a swell partition.
#
# Chosen deliberately on 2026-07-31: 41070 publishes no partition data and
# never will, so the honest label would read SEAS permanently and distinguish
# nothing. The cost is that the 41113 fallback, which does report a genuine
# partition, now shares the same word. Set to null for honest labels.
display:
  wave_label: SWELL

trend:
  window_hours: 6
  minimum_samples: 4
  minimum_coverage_hours: 3
  change_threshold_ft: 0.30

forecast:
  provider: open_meteo
  horizon_hours: 168
  collection_interval_minutes: 360

stations:
  ndbc:41070:
    id: ndbc:41070
    provider: ndbc
    provider_station_id: "41070"
    canonical_physical_station_id: "ndbc:41070"
    name: Ponce de Leon Inlet Waves (PNCWAVE)
    latitude: 29.289
    longitude: -80.803
    expected_interval_minutes: 60
    poll_interval_minutes: 10
    capabilities: [waves, water_temperature]
    attribution: NOAA National Data Buoy Center
  ndbc:41069:
    id: ndbc:41069
    provider: ndbc
    provider_station_id: "41069"
    canonical_physical_station_id: "ndbc:41069"
    name: Ponce de Leon Inlet (PNC)
    latitude: 29.289
    longitude: -80.803
    expected_interval_minutes: 60
    poll_interval_minutes: 10
    capabilities: [wind]
    attribution: NOAA National Data Buoy Center
  ndbc:41113:
    id: ndbc:41113
    provider: ndbc
    provider_station_id: "41113"
    canonical_physical_station_id: "cdip:143"
    name: Cape Canaveral Nearshore
    latitude: 28.400
    longitude: -80.533
    expected_interval_minutes: 30
    poll_interval_minutes: 10
    capabilities: [waves, separated_swell]
    attribution: NOAA NDBC / CDIP
  # Subordinate high/low prediction station. It publishes no live observed
  # water level, so only the phase between adjacent extremes is derived, and
  # it is always labeled a prediction. 8721164 is deliberately not used: it
  # sits inside Mosquito Lagoon and its timing differs materially.
  coops:8721147:
    id: coops:8721147
    provider: coops
    provider_station_id: "8721147"
    canonical_physical_station_id: "coops:8721147"
    name: Ponce de Leon Inlet South
    latitude: 29.0717
    longitude: -80.9200
    expected_interval_minutes: 720
    capabilities: [tide_predictions]
    attribution: NOAA CO-OPS

spots:
  new-smyrna:
    name: New Smyrna Beach
    display_name: NEW SMYRNA
    timezone: America/New_York
    latitude: 29.0258
    longitude: -80.9270
    wave_sources:
      - station_id: ndbc:41070
        role: primary
        maximum_usable_age_minutes: 360
        preferred_basis: [separated_swell, total_sea]
      - station_id: ndbc:41113
        role: fallback
        maximum_usable_age_minutes: 360
        preferred_basis: [separated_swell, total_sea]
    wind_sources:
      - station_id: ndbc:41069
        role: primary
        maximum_usable_age_minutes: 360
    tide_source:
      station_id: coops:8721147
      name: Ponce de Leon Inlet South
      datum: MLLW
      horizon_days: 3
      collection_interval_minutes: 720
